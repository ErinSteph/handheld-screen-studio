<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: {{CSP}}; style-src {{CSP}}; script-src 'nonce-{{NONCE}}';"><link rel="stylesheet" href="{{STYLE}}"></head><body>
<header><div><strong>Handheld Screen Studio</strong><span>by Erin Steph · preview 0.2</span></div><button id="newLayout">New handheld layout…</button><button id="openLayout">Open layout…</button><button id="add">Add screen…</button><button id="addElement">Add element…</button><button id="refresh">Refresh</button><button id="save">Save source</button></header>
<nav><select id="platform"><option value="ds">Nintendo DS · 256 × 192</option><option value="gba">Game Boy Advance · 240 × 160</option></select><select id="scene"></select><label>Zoom <select id="zoom"><option selected>2</option><option>3</option><option>4</option></select></label><label><input id="grid" type="checkbox"> Grid</label></nav>
<label id="hardwareLabel" hidden>Handheld profile <select id="hardware"></select></label>
<p class="notice" id="notice">Loading editor…</p>
<main><section class="preview"><canvas id="screen"></canvas><p id="status">Loading source…</p><p id="error" role="alert"></p><small>Drag a literal-position element to move it; drag its lower-right handle to resize supported rectangles. Undo in VS Code restores source edits.</small></section>
<aside><h3>Screen elements</h3><div id="layers"></div><h3>Selected element</h3><div id="inspector"></div><pre id="code"></pre><button id="reveal">Show source</button></aside></main><footer id="file"></footer>
<script nonce="{{NONCE}}" src="{{SCRIPT}}"></script></body></html>
