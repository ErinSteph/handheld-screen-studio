<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: {{CSP}}; style-src {{CSP}}; script-src 'nonce-{{NONCE}}';"><link rel="stylesheet" href="{{STYLE}}"></head><body>
<header><div class="identity"><strong>Handheld Screen Studio</strong><span>by Erin Steph · preview 0.6</span></div><button id="newProject">New project…</button><button id="add">New screen…</button><button id="addElement" hidden>Add element…</button><button id="save">Save</button><details id="tools"><summary>More…</summary><div class="tool-menu"><button id="scan">Scan C/C++…</button><button id="adapt">Adapt drawing function…</button><button id="openLayout">Open layout…</button><button id="newLayout">New portable layout…</button><button id="export" disabled>Export source…</button><button id="exportProject" disabled>Export runnable project…</button><button id="refresh">Refresh preview</button></div></details></header>
<nav aria-label="Screen selection"><select id="platform" aria-label="Source file"></select><select id="scene" aria-label="Screen"></select><label>Zoom <select id="zoom"><option value="fit" selected>Fit</option><option>1</option><option>2</option><option>3</option><option>4</option></select></label><label><input id="grid" type="checkbox"> Grid</label></nav>
<label id="hardwareLabel" hidden>Preview device <select id="hardware"></select><select id="display" aria-label="Preview display" hidden></select></label>
<details id="limits"><summary id="noticeSummary">Loading preview…</summary><p class="notice" id="notice"></p></details>
<main><section class="preview"><canvas id="screen"></canvas><p id="status">Loading source…</p><p id="error" role="status"></p><small>Drag to move. Use the corner handle to resize supported elements. Undo in VS Code restores source edits.</small></section>
<aside><h3>Screen elements</h3><div id="layers"></div><h3>Properties</h3><div id="inspector"></div><details class="source-detail"><summary>Drawing call</summary><pre id="code"></pre><button id="reveal">Show source</button></details></aside></main><footer id="file"></footer>
<script nonce="{{NONCE}}" src="{{SCRIPT}}"></script></body></html>
